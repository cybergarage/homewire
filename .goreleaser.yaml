# Release builds of homewire: GoReleaser builds the hub for Linux on amd64 and
# arm64 and packages it as .deb with the systemd service.
#
#   goreleaser release --snapshot --clean   # a local build into dist/
version: 2

project_name: homewire

before:
  hooks:
    # The hub embeds the web UI from web/dist.
    - make web

builds:
  - id: homewire
    main: ./cmd/homewire
    binary: homewire
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/cybergarage/homewire/internal/version.Version={{ .Version }}

archives:
  - id: homewire
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

nfpms:
  - id: homewire
    package_name: homewire
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/cybergarage/homewire
    maintainer: Satoshi Konno <skonno@cybergarage.org>
    description: |-
      Matter hub with a web UI.
      homewire commissions Matter devices over Bluetooth or the local network
      into a fabric of its own, follows their attributes and controls them
      from a browser.
    license: Apache-2.0
    section: net
    priority: optional
    formats:
      - deb
    bindir: /usr/bin
    dependencies:
      - adduser
      - init-system-helpers
    recommends:
      - bluez
    contents:
      - src: packaging/homewire.service
        dst: /usr/lib/systemd/system/homewire.service
        file_info:
          mode: 0644
      - src: packaging/homewire.default
        dst: /etc/default/homewire
        type: config|noreplace
        file_info:
          mode: 0644
      # The launcher of the app grid runs `homewire open`. GNOME's icon and
      # desktop caches are refreshed by the triggers of hicolor-icon-theme
      # and desktop-file-utils.
      - src: packaging/homewire.desktop
        dst: /usr/share/applications/homewire.desktop
        file_info:
          mode: 0644
      - src: packaging/icons/homewire.svg
        dst: /usr/share/icons/hicolor/scalable/apps/homewire.svg
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-16.png
        dst: /usr/share/icons/hicolor/16x16/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-22.png
        dst: /usr/share/icons/hicolor/22x22/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-24.png
        dst: /usr/share/icons/hicolor/24x24/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-32.png
        dst: /usr/share/icons/hicolor/32x32/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-48.png
        dst: /usr/share/icons/hicolor/48x48/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-64.png
        dst: /usr/share/icons/hicolor/64x64/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-128.png
        dst: /usr/share/icons/hicolor/128x128/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-256.png
        dst: /usr/share/icons/hicolor/256x256/apps/homewire.png
        file_info:
          mode: 0644
      - src: packaging/icons/homewire-512.png
        dst: /usr/share/icons/hicolor/512x512/apps/homewire.png
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/homewire/README.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/homewire/copyright
        file_info:
          mode: 0644
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/homewire/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: checksums.txt

snapshot:
  # A pre-release of semver: nfpm writes it in the .deb as 0.9.1~dev.<commit>,
  # which sorts before 0.9.1. GoReleaser refuses "~" in the version itself.
  version_template: "{{ incpatch .Version }}-dev.{{ .ShortCommit }}"

changelog:
  use: github-native

release:
  # The release is left as a draft, to be checked and published by hand.
  draft: true
  prerelease: auto
